{% set name = "wagtail-linkchecker" %}
{% set version = "0.6.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/wagtail-linkchecker-{{ version }}.tar.gz
  sha256: 2bdd457ee757ae52e0f00196739e84f5f21e0e40212ae3d6170e108efd62b6e1

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 1

requirements:
  host:
    - python {{ python_min }}
    - pip
  run:
    - python >={{ python_min }}
    - wagtail >=1.0
    - requests >=2.9.1
    - celery >=4.0,<5

test:
  imports:
    - wagtaillinkchecker
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/neon-jungle/wagtail-linkchecker/
  summary: A tool to assist with finding broken links on your wagtail site.
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - rxm7706
